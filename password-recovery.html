<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля | FakeBook</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page-shared">

    <a href="login.html" style="position:fixed; top:24px; left:24px; text-decoration:none; color:var(--primary); font-weight:600; font-size:14px;">← Назад войти</a>

    <div class="auth-card-shared">
        <h2>Восстановление</h2>
        <p class="auth-subtitle">Введите свою почту для поиска аккаунта</p>

        <form class="recovery" id="recoveryForm">
            <div class="auth-field-shared">
                <label for="email">Электронная почта</label>
                <input type="email" id="email" class="auth-input-shared" placeholder="your@email.com" required>
            </div>

            <button type="submit" class="auth-btn-primary">Продолжить</button>

            <div id="msg"></div>
        </form>
    </div>

    <script src="password-recovery.js"></script>
</body>
</html>
