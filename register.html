<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | FakeBook</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page-shared">

    <div class="auth-card-shared">
        <h2>Регистрация</h2>
        <p class="auth-subtitle">Создайте аккаунт, чтобы продолжить</p>

        <form class="form-wrap" onsubmit="register(event)">
            <div class="auth-field-shared">
                <label for="name">Имя</label>
                <input type="text" id="name" name="name" class="auth-input-shared" placeholder="Введи имя" required>
            </div>

            <div class="auth-field-shared">
                <label for="email">Email</label>
                <input type="email" id="email" class="auth-input-shared" placeholder="your@example.ru" required>
            </div>

            <div class="auth-field-shared">
                <label for="password">Пароль</label>
                <input type="password" id="password" class="auth-input-shared" placeholder="Введите пароль" required>
            </div>

            <button type="submit" class="auth-btn-primary">Зарегистрироваться</button>

            <div id="msg"></div>

            <p class="switch-link">Уже есть аккаунт? <a href="login.html">Войти</a></p>
        </form>
    </div>

    <script src="register.js"></script>
</body>
</html>
